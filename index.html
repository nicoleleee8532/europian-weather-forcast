<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/master.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>European Weather Forecast</title>
  <style>
    body { font-family: 'Pacifico'; text-align: center; background: #f2f6fc; }
    h1 { background: #FFC0CB; color: #fff; padding: 20px; margin: 0; }
    form { margin: 20px; }
    select, button { padding: 10px; margin: 5px; }
    #forecast { margin-top: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; }
    .day { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; width: 120px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<h1>7-Day Weather Forecast</h1>

<form id="city-form">
  <label for="city">Select a European city:</label>
  <select id="city"></select>
  <button type="submit">Get Forecast</button>
</form>

<div id="forecast"></div>

<script src="js/main.js"></script>
</body>
</html>
